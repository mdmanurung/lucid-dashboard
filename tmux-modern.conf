# Modern tmux look for light and dark terminals: flat top bar, quiet inactive windows, pane
# labels, rounded popups. Plain text uses the terminal's own colour; accents are mid-tone xterm-256
# colours that keep contrast on both backgrounds (greys stay near 4.5:1 on white and on near-black).
# Try live:  tmux source-file /path/to/tmux-modern.conf
# Keep it:   add  source-file /path/to/tmux-modern.conf  to ~/.tmux.conf, above any TPM lines.
# Undo live: tmux set -g status-position bottom \; set -g pane-border-status off \; source-file ~/.tmux.conf

set -g status-position top
set -g status-interval 5
set -g status-style 'bg=default,fg=default'
set -g status-left-length 60
# red badge while claude-dash runs and agents wait on you (it sets the session option @claude_need)
set -g status-left '#[fg=colour231,bg=colour25,bold] #S #[default] #{?@claude_need,#[fg=colour231#,bg=colour160#,bold] #{@claude_need} NEED YOU #[default] ,}'
set -g status-right-length 80
set -g status-right '#{?client_prefix,#[fg=colour16#,bg=colour214#,bold] PREFIX #[default] ,}#{?pane_synchronized,#[fg=colour231#,bg=colour160#,bold] SYNC #[default] ,}#[fg=colour243]#{host_short}  %H:%M '

# windows: grey unless current (blue, bold); a window that rang the bell turns red
set -g window-status-separator ''
set -g window-status-style 'fg=colour243,bg=default'
set -g window-status-current-style 'fg=colour25,bg=default,bold'
set -g window-status-bell-style 'fg=colour160,bg=default,bold'
set -g window-status-format ' #I #W#{?window_flags,#{window_flags},} '
set -g window-status-current-format ' #I #W#{?window_zoomed_flag, (zoom),} '

# panes: a label on each border; Claude Code sets the pane title to its task name
set -g pane-border-status top
set -g pane-border-lines single
set -g pane-border-format ' #{?pane_active,#[fg=colour25#,bold],#[fg=colour243]}#P #{pane_title} '
set -g pane-border-style 'fg=colour248'
set -g pane-active-border-style 'fg=colour32'

# popups, prompts and copy mode: their own background, so they read the same on either theme
set -g popup-border-lines rounded
set -g popup-border-style 'fg=colour32'
set -g message-style 'fg=colour231,bg=colour238'
set -g mode-style 'fg=colour231,bg=colour25'
