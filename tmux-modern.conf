# Modern tmux look: flat top bar, dim inactive windows, pane labels, rounded popups.
# Try live:  tmux source-file /exports/para-lipg-hpc/mdmanurung/lucid-dashboard/tmux-modern.conf
# Keep it:   add  source-file <this path>  to ~/.tmux.conf, above the TPM lines.
# Undo live: tmux set -g status-position bottom \; set -g pane-border-status off \; source-file ~/.tmux.conf
# Palette: Tokyo Night (needs truecolor; RGB is already on in terminal-features).

set -g status-position top
set -g status-interval 5
set -g status-style 'bg=default,fg=#a9b1d6'
set -g status-left-length 30
set -g status-left '#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[default] '
set -g status-right-length 80
set -g status-right '#{?client_prefix,#[fg=#1a1b26#,bg=#e0af68#,bold] PREFIX #[default] ,}#{?pane_synchronized,#[fg=#1a1b26#,bg=#f7768e#,bold] SYNC #[default] ,}#[fg=#565f89]#{host_short}  %H:%M '

# windows: quiet unless current; a window that rang the bell (claude-dash: an agent needs you) turns red
set -g window-status-separator ''
set -g window-status-style 'fg=#565f89,bg=default'
set -g window-status-current-style 'fg=#7aa2f7,bg=default,bold'
set -g window-status-bell-style 'fg=#f7768e,bg=default,bold'
set -g window-status-format ' #I #W#{?window_flags,#{window_flags},} '
set -g window-status-current-format ' #I #W#{?window_zoomed_flag, (zoom),} '

# panes: a label on each border; Claude Code sets the pane title to its task name
set -g pane-border-status top
set -g pane-border-format ' #{?pane_active,#[fg=#7aa2f7#,bold],#[fg=#565f89]}#P #{pane_title} '
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#7aa2f7'

# popups, prompts and copy mode
set -g popup-border-lines rounded
set -g popup-border-style 'fg=#7aa2f7'
set -g message-style 'fg=#c0caf5,bg=#292e42'
set -g mode-style 'fg=#c0caf5,bg=#364a82'
